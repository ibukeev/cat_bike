<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1100" viewBox="0 0 1600 1100">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#dce8ef"/><stop offset="1" stop-color="#9db1bf"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f5d27e"/><stop offset="0.55" stop-color="#d59a38"/><stop offset="1" stop-color="#ad7020"/></linearGradient>
    <linearGradient id="bracket" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#a9cadd"/><stop offset="1" stop-color="#5d88a2"/></linearGradient>
    <pattern id="hatch" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="10" stroke="#718695" stroke-width="2" opacity="0.26"/></pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#28475b"/></marker>
    <marker id="redArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#c64f3b"/></marker>
    <marker id="dot" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5"><circle cx="5" cy="5" r="4" fill="#28475b"/></marker>
    <style>
      .title { font: 700 35px 'DejaVu Sans', sans-serif; fill: #173246; }
      .subtitle { font: 400 17px 'DejaVu Sans', sans-serif; fill: #526a79; }
      .panel-title { font: 700 22px 'DejaVu Sans', sans-serif; fill: #173246; letter-spacing: 1px; }
      .label { font: 600 17px 'DejaVu Sans', sans-serif; fill: #203d50; }
      .small { font: 400 15px 'DejaVu Sans', sans-serif; fill: #526a79; }
      .tiny { font: 400 13px 'DejaVu Sans', sans-serif; fill: #607685; }
      .note { font: 600 15px 'DejaVu Sans', sans-serif; fill: #694316; }
      .dim { fill: none; stroke: #28475b; stroke-width: 2; marker-start: url(#arrow); marker-end: url(#arrow); }
      .ext { fill: none; stroke: #81949f; stroke-width: 1.5; stroke-dasharray: 5 5; }
      .leader { fill: none; stroke: #28475b; stroke-width: 2; marker-start: url(#dot); }
      .bolt { fill: #dc5c3f; stroke: #83311e; stroke-width: 2.5; }
    </style>
  </defs>
  <rect width="1600" height="1100" fill="#f6fafc"/>
  <rect x="30" y="28" width="1540" height="1037" rx="24" fill="#fff" stroke="#d7e2e8" stroke-width="2"/>
  <text x="75" y="84" class="title">Forward-projecting rail yoke — corrected concept</text>
  <text x="75" y="116" class="subtitle">Two rails carry loads from the front of the sculpture directly into the rear metal backplate</text>

  <rect x="65" y="150" width="805" height="855" rx="18" fill="#f5f9fb" stroke="#d4e1e8" stroke-width="2"/>
  <text x="100" y="194" class="panel-title">TOP VIEW — FORWARD-PROJECTING FORK</text>
  <text x="100" y="220" class="small">The head is omitted; pale cross-pieces represent printed skeleton ribs/channels</text>
  <path d="M170 260 H108" fill="none" stroke="#28475b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="100" y="250" class="label">rear / bike</text>
  <path d="M720 260 H800" fill="none" stroke="#28475b" stroke-width="2.5" marker-end="url(#arrow)"/><text x="690" y="250" class="label">front / nose</text>

  <rect x="180" y="302" width="25" height="300" rx="5" fill="url(#plate)" stroke="#536c7b" stroke-width="3"/><rect x="180" y="302" width="25" height="300" rx="5" fill="url(#hatch)"/>
  <text x="146" y="452" class="label" text-anchor="middle" transform="rotate(-90 146 452)">≈100 mm backplate width</text>
  <rect x="205" y="352" width="550" height="18" rx="5" fill="url(#rail)" stroke="#87591d" stroke-width="3"/><rect x="205" y="534" width="550" height="18" rx="5" fill="url(#rail)" stroke="#87591d" stroke-width="3"/>
  <path d="M740 348 l16 13 l-16 13 M740 530 l16 13 l-16 13" fill="none" stroke="#87591d" stroke-width="3"/>

  <g>
    <rect x="205" y="330" width="125" height="13" rx="3" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/><rect x="205" y="379" width="125" height="13" rx="3" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/><rect x="192" y="322" width="24" height="78" rx="4" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/>
    <line x1="250" y1="326" x2="250" y2="396" stroke="#6b7880" stroke-width="7"/><circle cx="250" cy="329" r="7" class="bolt"/><circle cx="250" cy="393" r="7" class="bolt"/>
    <line x1="300" y1="326" x2="300" y2="396" stroke="#6b7880" stroke-width="7"/><circle cx="300" cy="329" r="7" class="bolt"/><circle cx="300" cy="393" r="7" class="bolt"/>
  </g>
  <g>
    <rect x="205" y="512" width="125" height="13" rx="3" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/><rect x="205" y="561" width="125" height="13" rx="3" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/><rect x="192" y="504" width="24" height="78" rx="4" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/>
    <line x1="250" y1="508" x2="250" y2="578" stroke="#6b7880" stroke-width="7"/><circle cx="250" cy="511" r="7" class="bolt"/><circle cx="250" cy="575" r="7" class="bolt"/>
    <line x1="300" y1="508" x2="300" y2="578" stroke="#6b7880" stroke-width="7"/><circle cx="300" cy="511" r="7" class="bolt"/><circle cx="300" cy="575" r="7" class="bolt"/>
  </g>

  <g opacity="0.8">
    <rect x="440" y="318" width="38" height="268" rx="14" fill="#dff0ec" stroke="#4c9a8d" stroke-width="3" stroke-dasharray="8 5"/><rect x="650" y="318" width="38" height="268" rx="14" fill="#dff0ec" stroke="#4c9a8d" stroke-width="3" stroke-dasharray="8 5"/>
    <rect x="430" y="342" width="58" height="38" rx="10" fill="#bce2da" stroke="#4c9a8d" stroke-width="2"/><rect x="430" y="524" width="58" height="38" rx="10" fill="#bce2da" stroke="#4c9a8d" stroke-width="2"/><rect x="640" y="342" width="58" height="38" rx="10" fill="#bce2da" stroke="#4c9a8d" stroke-width="2"/><rect x="640" y="524" width="58" height="38" rx="10" fill="#bce2da" stroke="#4c9a8d" stroke-width="2"/>
  </g>

  <path d="M270 330 C350 292,420 282,505 282" class="leader"/><text x="520" y="279" class="label">Pair of 90° metal brackets</text><text x="520" y="301" class="small">sandwiches each rail at its root</text>
  <text x="560" y="625" class="label">Cross-ribs tie both rails together</text><text x="560" y="647" class="small">and prevent twisting inside printed channels</text><path d="M669 586 C683 602,700 606,735 610" class="leader"/>

  <path d="M785 361 h30 M785 543 h30" class="ext"/><path d="M802 361 V543" class="dim"/><rect x="713" y="433" width="122" height="39" rx="8" fill="#f5f9fb"/><text x="774" y="449" class="label" text-anchor="middle">≈55–65 mm</text><text x="774" y="468" class="tiny" text-anchor="middle">rail spacing</text>
  <path d="M205 614 v33 M755 614 v33" class="ext"/><path d="M205 635 H755" class="dim"/><rect x="410" y="619" width="140" height="35" rx="8" fill="#f5f9fb"/><text x="480" y="643" class="label" text-anchor="middle">≈180–220 mm</text>

  <line x1="100" y1="688" x2="835" y2="688" stroke="#d4e1e8" stroke-width="2"/>
  <text x="100" y="730" class="panel-title">SIDE VIEW — FLAT BAR ON EDGE</text><text x="100" y="755" class="small">The ½-inch dimension is vertical; the ⅛-inch thickness points into the page</text>
  <rect x="180" y="782" width="25" height="165" rx="5" fill="url(#plate)" stroke="#536c7b" stroke-width="3"/><rect x="205" y="838" width="550" height="38" rx="5" fill="url(#rail)" stroke="#87591d" stroke-width="3"/>
  <rect x="205" y="815" width="120" height="84" rx="8" fill="none" stroke="#426b83" stroke-width="5"/><path d="M205 899 L180 922 L180 815 L205 815" fill="url(#bracket)" stroke="#426b83" stroke-width="3"/><circle cx="255" cy="856" r="8" class="bolt"/><circle cx="302" cy="856" r="8" class="bolt"/>
  <rect x="438" y="812" width="42" height="92" rx="11" fill="#dff0ec" stroke="#4c9a8d" stroke-width="3" stroke-dasharray="7 5"/><rect x="648" y="812" width="42" height="92" rx="11" fill="#dff0ec" stroke="#4c9a8d" stroke-width="3" stroke-dasharray="7 5"/>
  <path d="M740 795 v30 M695 795 v30" fill="none" stroke="#c64f3b" stroke-width="4" marker-end="url(#redArrow)"/><text x="613" y="790" class="note">weight + vibration</text>
  <path d="M680 926 H230" fill="none" stroke="#c64f3b" stroke-width="4" marker-end="url(#redArrow)"/><text x="390" y="951" class="note">load returns through rails to metal plate</text>
  <path d="M778 838 h35 M778 876 h35" class="ext"/><path d="M800 838 V876" class="dim"/><text x="815" y="852" class="label">½ in</text><text x="815" y="872" class="tiny">vertical</text>

  <rect x="895" y="150" width="640" height="855" rx="18" fill="#f5f9fb" stroke="#d4e1e8" stroke-width="2"/>
  <text x="930" y="194" class="panel-title">TOP SECTION THROUGH ONE RAIL ROOT</text><text x="930" y="220" class="small">Two brackets form a metal clevis around the rail</text>
  <rect x="1005" y="285" width="38" height="345" rx="5" fill="url(#plate)" stroke="#536c7b" stroke-width="3"/><rect x="1005" y="285" width="38" height="345" rx="5" fill="url(#hatch)"/><text x="995" y="452" class="label" text-anchor="middle" transform="rotate(-90 995 452)">3 mm backplate</text>
  <rect x="1043" y="438" width="385" height="22" rx="5" fill="url(#rail)" stroke="#87591d" stroke-width="3"/><path d="M1412 434 l17 15 l-17 15" fill="none" stroke="#87591d" stroke-width="3"/>
  <rect x="1043" y="405" width="190" height="16" rx="3" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/><rect x="1043" y="477" width="190" height="16" rx="3" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/><rect x="1017" y="382" width="36" height="139" rx="4" fill="url(#bracket)" stroke="#426b83" stroke-width="2"/>
  <g>
    <line x1="1100" y1="396" x2="1100" y2="501" stroke="#687780" stroke-width="9"/><circle cx="1100" cy="397" r="10" class="bolt"/><path d="M1094 391 l12 12 M1106 391 l-12 12" stroke="#fff4ee" stroke-width="2"/><path d="M1089 501 h22 l8 10 l-8 10 h-22 l-8-10 Z" fill="#87969e" stroke="#45555e" stroke-width="2"/>
    <line x1="1170" y1="396" x2="1170" y2="501" stroke="#687780" stroke-width="9"/><circle cx="1170" cy="397" r="10" class="bolt"/><path d="M1164 391 l12 12 M1176 391 l-12 12" stroke="#fff4ee" stroke-width="2"/><path d="M1159 501 h22 l8 10 l-8 10 h-22 l-8-10 Z" fill="#87969e" stroke="#45555e" stroke-width="2"/>
  </g>
  <circle cx="1024" cy="410" r="9" class="bolt"/><circle cx="1024" cy="492" r="9" class="bolt"/>
  <path d="M1097 406 C1060 335,1020 302,950 275" class="leader"/><text x="930" y="255" class="label">2 rail bolts</text><text x="930" y="277" class="small">M4 shown; final size after coupon test</text>
  <path d="M1024 492 C972 535,948 558,930 585" class="leader"/><text x="930" y="612" class="label">Bracket feet bolt to plate</text><text x="930" y="634" class="small">metal-to-metal; washers + nyloc nuts</text>
  <path d="M1044 449 C1115 570,1290 608,1475 585" class="leader"/><text x="1245" y="612" class="label">Rail end may be square</text><text x="1245" y="634" class="small">the end face does not carry the bending load</text>

  <rect x="930" y="662" width="570" height="305" rx="14" fill="#fff" stroke="#d4e1e8" stroke-width="2"/><text x="960" y="702" class="panel-title">SETTING THE RAIL ANGLE</text>
  <rect x="955" y="726" width="250" height="112" rx="12" fill="#eef8f4" stroke="#67a596" stroke-width="2"/><text x="972" y="752" class="label">Recommended: 90° root</text><line x1="1007" y1="778" x2="1007" y2="824" stroke="#536c7b" stroke-width="9"/><line x1="1012" y1="800" x2="1170" y2="800" stroke="#c58a2c" stroke-width="15"/><path d="M1012 821 V780 H1050" fill="none" stroke="#5d88a2" stroke-width="9"/><path d="M1030 784 A28 28 0 0 1 1048 802" fill="none" stroke="#28475b" stroke-width="2"/><text x="1060" y="824" class="tiny">simple, stiff, easy to align</text>
  <rect x="1225" y="726" width="250" height="112" rx="12" fill="#fff8e8" stroke="#e0bd63" stroke-width="2"/><text x="1242" y="752" class="label">If a slight tilt is necessary</text><line x1="1275" y1="778" x2="1275" y2="824" stroke="#536c7b" stroke-width="9"/><line x1="1280" y1="806" x2="1442" y2="784" stroke="#c58a2c" stroke-width="15"/><path d="M1280 821 L1280 781 L1322 797 L1322 813 Z" fill="#5d88a2" stroke="#426b83" stroke-width="2"/><text x="1335" y="824" class="tiny">metal angled clevis/wedge</text>
  <circle cx="982" cy="880" r="18" fill="#fff1ee" stroke="#c64f3b" stroke-width="3"/><path d="M971 869 l22 22 M993 869 l-22 22" stroke="#c64f3b" stroke-width="4"/><text x="1015" y="876" class="label">An angled end cut alone is not a connection.</text><text x="1015" y="899" class="small">It changes the contact face; the bracket still carries the moment.</text>
  <text x="960" y="936" class="note">Easiest whole-head tilt: put the angle in the removable bike-side adapter</text><text x="960" y="957" class="tiny">and keep the internal backplate-to-rail yoke square.</text>
  <text x="800" y="1040" class="tiny" text-anchor="middle">Concept rev B · ½ × ⅛ in flat bars shown on edge · ½ in square tube remains a stiffer upgrade · not a fabrication template</text>
</svg>

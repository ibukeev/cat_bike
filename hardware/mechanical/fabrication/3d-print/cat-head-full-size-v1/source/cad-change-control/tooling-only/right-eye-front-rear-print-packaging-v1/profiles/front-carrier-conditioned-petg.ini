# Tooling-only conservative conditioned opaque PETG baseline for an enclosed
# MK4S with a 0.4 mm nozzle. Dry the specific filament to its maker's guidance
# and keep it dry during printing; no universal drying temperature is assumed.
# Geometry scale, wall count, and fit-critical compensation stay frozen.
printer_technology = FFF
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PETG
layer_height = 0.2
first_layer_height = 0.2
perimeters = 4
top_solid_layers = 5
bottom_solid_layers = 5
fill_density = 25%
fill_pattern = gyroid
thin_walls = 1
support_material = 0
support_material_auto = 0
support_material_style = snug
support_material_threshold = 45
support_material_buildplate_only = 1
brim_type = outer_only
brim_width = 4
brim_separation = 0.1
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 85
cooling = 1
fan_always_on = 1
min_fan_speed = 20
max_fan_speed = 40
disable_fan_first_layers = 3
ironing = 0
elefant_foot_compensation = 0.2
avoid_crossing_perimeters = 1
seam_position = rear

# Tooling-only 0.90 mm natural/translucent PETG eye-lens baseline.
# Print one broad face flat. Six 0.15 mm solid layers give exactly 0.90 mm.
printer_technology = FFF
nozzle_diameter = 0.4
filament_diameter = 1.75
filament_type = PETG
layer_height = 0.15
first_layer_height = 0.15
perimeters = 3
top_solid_layers = 6
bottom_solid_layers = 6
fill_density = 100%
fill_pattern = rectilinear
top_fill_pattern = monotonic
bottom_fill_pattern = monotonic
thin_walls = 1
support_material = 0
support_material_auto = 0
brim_type = outer_only
brim_width = 2
brim_separation = 0.1
temperature = 240
first_layer_temperature = 240
bed_temperature = 80
first_layer_bed_temperature = 85
cooling = 1
fan_always_on = 1
min_fan_speed = 20
max_fan_speed = 40
disable_fan_first_layers = 3
ironing = 0
elefant_foot_compensation = 0.15
avoid_crossing_perimeters = 1
seam_position = rear
